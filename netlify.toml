# Tagwerk – statische Seite ohne Build. Deine Daten gehen nie an Netlify,
# ausgeliefert werden nur diese Dateien.
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    # Immer beim Server nachfragen (ETag) – so kommen neue Versionen sofort an.
    Cache-Control = "no-cache"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
